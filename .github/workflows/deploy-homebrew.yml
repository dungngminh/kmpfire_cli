name: Deploy Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  update-formula:
    name: Update homebrew-kmpfire_cli formula
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kmpfire_cli
        uses: actions/checkout@v4

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: dungngminh/homebrew-kmpfire_cli
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate formula
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          curl --fail -sL "${base}/kmpfire-macos-arm64.tar.gz" -o macos-arm64.tar.gz
          curl --fail -sL "${base}/kmpfire-macos-x64.tar.gz" -o macos-x64.tar.gz
          curl --fail -sL "${base}/kmpfire-linux-x64.tar.gz" -o linux-x64.tar.gz

          ARM64_SHA=$(sha256sum macos-arm64.tar.gz | cut -d ' ' -f 1)
          X64_SHA=$(sha256sum macos-x64.tar.gz | cut -d ' ' -f 1)
          LINUX_X64_SHA=$(sha256sum linux-x64.tar.gz | cut -d ' ' -f 1)

          mkdir -p homebrew-tap/Formula
          cp .github/homebrew/kmpfire.rb.template homebrew-tap/Formula/kmpfire.rb
          sed -i "s/{{VERSION}}/${VERSION}/g" homebrew-tap/Formula/kmpfire.rb
          sed -i "s/{{ARM64_SHA256}}/${ARM64_SHA}/g" homebrew-tap/Formula/kmpfire.rb
          sed -i "s/{{X64_SHA256}}/${X64_SHA}/g" homebrew-tap/Formula/kmpfire.rb
          sed -i "s/{{LINUX_X64_SHA256}}/${LINUX_X64_SHA}/g" homebrew-tap/Formula/kmpfire.rb

          echo "Generated Formula/kmpfire.rb for ${VERSION}"
          cat homebrew-tap/Formula/kmpfire.rb

      - name: Commit and push formula
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kmpfire.rb
          if git diff --staged --quiet; then
            echo "No formula changes"
          else
            git commit -m "Update kmpfire to ${{ steps.release.outputs.version }}"
            git push
          fi

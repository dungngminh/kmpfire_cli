name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v0.1.0). Leave empty when pushing a new tag."
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JVM tests
        run: ./gradlew jvmTest --no-daemon

  native:
    name: Build ${{ matrix.artifact }}
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: linkReleaseExecutableMacosArm64
            artifact: kmpfire-macos-arm64
            path: build/bin/macosArm64/releaseExecutable/kmpfire.kexe
          - os: macos-15-intel
            task: linkReleaseExecutableMacosX64
            artifact: kmpfire-macos-x64
            path: build/bin/macosX64/releaseExecutable/kmpfire.kexe
          - os: ubuntu-latest
            task: linkReleaseExecutableLinuxX64
            artifact: kmpfire-linux-x64
            path: build/bin/linuxX64/releaseExecutable/kmpfire.kexe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Link release executable
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - name: Package archive
        run: |
          cp "${{ matrix.path }}" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --version || ./${{ matrix.artifact }} -V || true
          tar -czvf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt
          ls -la
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          token: ${{ secrets.GH_PAT }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt

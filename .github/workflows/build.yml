name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: JVM tests
        run: ./gradlew jvmTest --no-daemon

  native:
    name: Native ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            task: linkReleaseExecutableMacosArm64
            artifact: kmpfire-macos-arm64
            path: build/bin/macosArm64/releaseExecutable/kmpfire.kexe
          - os: macos-15-intel
            task: linkReleaseExecutableMacosX64
            artifact: kmpfire-macos-x64
            path: build/bin/macosX64/releaseExecutable/kmpfire.kexe
          - os: ubuntu-latest
            task: linkReleaseExecutableLinuxX64
            artifact: kmpfire-linux-x64
            path: build/bin/linuxX64/releaseExecutable/kmpfire.kexe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Link release executable
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - name: Smoke binary
        run: |
          cp "${{ matrix.path }}" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          ./${{ matrix.artifact }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
